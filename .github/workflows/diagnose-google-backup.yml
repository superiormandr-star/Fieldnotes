name: Read-only Google backup status
on:
  push:
    branches: ['diagnose/google-backup-status']
    paths: ['.github/workflows/diagnose-google-backup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - name: Check backup metadata without exposing records or tokens
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const sql = "SELECT (SELECT COUNT(*) FROM backup_connections WHERE id=1 AND refresh_token IS NOT NULL AND length(refresh_token)>0) AS authorized_connections, (SELECT COUNT(*) FROM backup_runs WHERE status='complete') AS completed_backups, (SELECT COUNT(*) FROM backup_runs WHERE drive_state='saved') AS drive_saved, (SELECT COUNT(*) FROM backup_runs WHERE email_state='sent') AS emails_sent, (SELECT COUNT(*) FROM backup_runs WHERE queued=1 AND status<>'complete') AS pending_backups";
          try {
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/c917ac1c9a3824a210d0fb77e5879329/d1/database/4feb6f63-1102-467a-87e6-256309364f12/query',{
              method:'POST',redirect:'error',signal:AbortSignal.timeout(20000),
              headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'},
              body:JSON.stringify({sql,params:[]})
            });
            const data=await response.json();
            if(!response.ok||data.success!==true)throw Error('Read-only database check failed: HTTP '+response.status);
            const row=data.result?.[0]?.results?.[0];
            for(const key of ['authorized_connections','completed_backups','drive_saved','emails_sent','pending_backups']){
              if(!Number.isSafeInteger(row?.[key])||row[key]<0)throw Error('Unexpected diagnostic result');
              console.log(key+': '+row[key]);
            }
          }catch(error){
            console.error(error.message.startsWith('Read-only database check failed: HTTP ')?error.message:'Unable to obtain backup status safely.');
            process.exitCode=1;
          }
          JS
