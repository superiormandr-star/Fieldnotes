name: Verify isolated live customer approval and invoice persistence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superior-command-center-production
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: CLOUDFLARE_API_TOKEN
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify live customer workflow with only generated QA records
        run: node ops/verify-live-customer-flow.mjs
      - name: Verify actual site and D1 readiness
        if: always()
        working-directory: cloudflare-command-center
        run: |
          echo 'https://superior-command-center.superiormandr.workers.dev' > "$RUNNER_TEMP/live-url.log"
          node scripts/verify-deployment.mjs "$RUNNER_TEMP/live-url.log"
