name: Read-only Superior production readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    defaults:
      run:
        working-directory: cloudflare-command-center
    env:
      CLOUDFLARE_ACCOUNT_ID: c917ac1c9a3824a210d0fb77e5879329
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check deployment source
        run: node scripts/inspect-deployment-source.mjs
      - name: Inspect binding presence without values
        run: node scripts/inspect-worker-settings.mjs
      - name: Inspect encrypted Microsoft connection and confirmed upload receipt
        run: node scripts/inspect-onedrive-readiness.mjs
      - name: Check live website and D1 health
        run: |
          echo 'https://superior-command-center.superiormandr.workers.dev' > "$RUNNER_TEMP/superior-live.log"
          node scripts/verify-deployment.mjs "$RUNNER_TEMP/superior-live.log"
