name: Diagnose Superior Worker binding metadata
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: superior-command-center-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    environment: CLOUDFLARE_API_TOKEN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read Worker binding and version metadata without values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const root='https://api.cloudflare.com/client/v4/accounts/c917ac1c9a3824a210d0fb77e5879329/workers/scripts/superior-command-center';
          const version='90f42d83-2bf5-46bb-bc51-7f4efc9de5ee';
          async function api(path,body){
            const r=await fetch(root+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});
            const data=await r.json();
            if(!r.ok||!data.success)throw Error('Worker recovery API failed: HTTP '+r.status);
            return data.result;
          }
          const allow=['OWNER_PASSWORD','SESSION_SECRET','DB','MICROSOFT_CLIENT_ID','MICROSOFT_CLIENT_SECRET','GOOGLE_CLIENT_ID','GOOGLE_CLIENT_SECRET'];
          const describe=bindings=>allow.map(name=>({name,type:bindings.find(b=>b.name===name)?.type||'missing'}));
          const settings=await api('/settings');
          console.log('Settings response keys: '+Object.keys(settings).join(', '));
          console.log('Settings metadata: '+JSON.stringify(describe(settings.bindings||[])));
          const deployments=await api('/deployments');
          console.log('Deployment versions: '+JSON.stringify((deployments.deployments||[]).slice(0,5).map(d=>({created_on:d.created_on,source:d.source,versions:d.versions}))));
          for(const id of [...new Set([version,...(deployments.deployments||[]).slice(0,6).flatMap(d=>d.versions.map(v=>v.version_id))])]){
            const v=await api('/versions/'+id);
            console.log('Version '+id+': '+JSON.stringify({created_on:v.metadata?.created_on,source:v.metadata?.source,handlers:v.resources?.script?.handlers,bindings:describe(v.resources?.bindings||[])}));
          }
          const subdomain=await api('/subdomain');
          console.log('Workers.dev enabled: '+Boolean(subdomain.enabled));
          const accountRoot='https://api.cloudflare.com/client/v4/accounts/c917ac1c9a3824a210d0fb77e5879329';
          async function inspect(path){
            const r=await fetch(accountRoot+path,{headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN}});
            const p=await r.json();
            console.log('Inspection '+path.split('?')[0]+' HTTP '+r.status);
            return p.success?p.result:null;
          }
          const scripts=await inspect('/workers/scripts');
          const script=scripts?.find(x=>x.id==='superior-command-center');
          if(script?.tag){
            const builds=await inspect('/builds/workers/'+script.tag);
            if(builds)console.log('Build configuration: '+JSON.stringify({keys:Object.keys(builds),correctRoot:builds.production_settings?.root_directory==='cloudflare-command-center',assetsDeploy:/--assets/.test(builds.production_settings?.deploy_command||''),productionMain:builds.git_repository?.branch==='main',scriptTag:script.tag}));
          }
          const workers=await inspect('/workers/workers');
          const worker=workers?.find(x=>x.name==='superior-command-center');
          if(worker)console.log('Target Worker UUID: '+worker.id);
          const history=await api('/versions?per_page=30');
          for(const item of (history.items||[]).slice(0,30)){
            const v=await api('/versions/'+item.id),bindings=v.resources?.bindings||[];
            console.log('History version: '+JSON.stringify({id:item.id,created_on:v.metadata?.created_on,source:v.metadata?.source,owner:bindings.some(b=>b.name==='OWNER_PASSWORD'),session:bindings.some(b=>b.name==='SESSION_SECRET'),microsoftId:bindings.some(b=>b.name==='MICROSOFT_CLIENT_ID'),microsoftSecret:bindings.some(b=>b.name==='MICROSOFT_CLIENT_SECRET')}));
          }
          JS
